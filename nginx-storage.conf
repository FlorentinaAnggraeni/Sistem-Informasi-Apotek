# Storage Image Protection
# This file is for Nginx configuration if using Nginx instead of Apache
# Place this in your Nginx server block if using Nginx

location /storage {
    alias /var/www/html/storage/app/public;
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
}

# Allow direct access to image files
location ~* ^/storage/\.(jpg|jpeg|png|gif|webp|svg|css|js)$ {
    alias /var/www/html/storage/app/public;
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
